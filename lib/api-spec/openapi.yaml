openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Public product catalogue and protected administration.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: orders
    description: Authenticated customer order history.
paths:
  /site-content:
    get:
      operationId: getSiteContent
      summary: Public website content
      responses:
        "200":
          description: Published website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
  /admin/content/story:
    put:
      operationId: saveStoryContent
      summary: Save website text (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryContentInput"
      responses:
        "200":
          description: Saved text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryContentInput"
  /admin/content/partners:
    post:
      operationId: createContentPartner
      summary: Add a collaborator (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPartnerInput"
      responses:
        "201":
          description: Created partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPartner"
  /admin/content/partners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: saveContentPartner
      summary: Edit a collaborator (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentPartnerInput"
      responses:
        "200":
          description: Saved partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPartner"
    delete:
      operationId: deleteContentPartner
      summary: Remove a collaborator (admin only)
      responses:
        "204": { description: Deleted partner }
  /admin/content/initiatives:
    post:
      operationId: createContentInitiative
      summary: Add an initiative (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInitiativeInput"
      responses:
        "201":
          description: Created initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentInitiative"
  /admin/content/initiatives/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    put:
      operationId: saveContentInitiative
      summary: Edit an initiative (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentInitiativeInput"
      responses:
        "200":
          description: Saved initiative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentInitiative"
    delete:
      operationId: deleteContentInitiative
      summary: Remove an initiative (admin only)
      responses:
        "204": { description: Deleted initiative }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List the product catalogue
      responses:
        "200":
          description: Product catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      tags: [products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Product deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for an admin image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/review-uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestReviewImageUploadUrl
      summary: Request a presigned URL for an authenticated customer review image
      security: [{ clerk: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewImageUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded product asset
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      security: [{ clerk: [] }]
      responses:
        "200": { description: Own orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } } }
    post:
      tags: [orders]
      operationId: createOrder
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderInput" } } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: cancelOrder
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CancelOrderInput" } } } }
      responses: { "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } } }
  /admin/orders:
    get:
      tags: [orders]
      operationId: adminListOrders
      security: [{ clerk: [] }]
      responses:
        "200": { description: All orders, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Order" } } } } }
  /admin/orders/{id}:
    patch:
      tags: [orders]
      operationId: adminUpdateOrder
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrderUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } } }
  /reviews:
    get:
      tags: [reviews]
      operationId: listReviews
      responses: { "200": { description: Approved reviews, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PublicReview" } } } } } }
    post:
      tags: [reviews]
      operationId: createReview
      security: [{ clerk: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } } }
  /reviews/mine:
    get:
      tags: [reviews]
      operationId: listOwnReviews
      security: [{ clerk: [] }]
      responses: { "200": { description: Own reviews, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Review" } } } } } }
  /admin/reviews:
    get:
      tags: [reviews]
      operationId: adminListReviews
      security: [{ clerk: [] }]
      responses: { "200": { description: All reviews, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Review" } } } } } }
  /admin/reviews/{id}:
    patch:
      tags: [reviews]
      operationId: adminUpdateReview
      security: [{ clerk: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Review" } } } } }
components:
  securitySchemes:
    clerk:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StoryContentInput:
      type: object
      required: [texts]
      properties:
        texts:
          type: object
          maxProperties: 100
          additionalProperties:
            type: string
            maxLength: 20000
    ContentPartnerInput:
      type: object
      required: [name, group, logoPath, sortOrder]
      properties:
        name: { type: string, minLength: 1, maxLength: 250 }
        group:
          type: string
          enum: [support, exhibition, corporate, college]
        logoPath: { type: string, maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    ContentPartner:
      allOf:
        - $ref: "#/components/schemas/ContentPartnerInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    ContentInitiativeInput:
      type: object
      required: [title, eyebrow, body, section, imagePaths, sortOrder]
      properties:
        title: { type: string, minLength: 1, maxLength: 250 }
        eyebrow: { type: string, maxLength: 250 }
        body: { type: string, maxLength: 20000 }
        section:
          type: string
          enum: [core, csr, student, impact, event]
        imagePaths:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 10000 }
    ContentInitiative:
      allOf:
        - $ref: "#/components/schemas/ContentInitiativeInput"
        - type: object
          required: [id]
          properties:
            id: { type: string }
    SiteContent:
      type: object
      required: [story, partners, initiatives]
      properties:
        story: { $ref: "#/components/schemas/StoryContentInput" }
        partners:
          type: array
          items: { $ref: "#/components/schemas/ContentPartner" }
        initiatives:
          type: array
          items: { $ref: "#/components/schemas/ContentInitiative" }
    Order:
      type: object
      properties:
        id: { type: string }
        number: { type: string }
        userId: { type: string }
        itemSnapshots: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        fullName: { type: string }
        phone: { type: string }
        pin: { type: string }
        address: { type: string }
        subtotal: { type: integer, minimum: 0 }
        shipping: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        status: { type: string, enum: [Pending, Confirmed, Dispatched, Cancelled] }
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, number, userId, itemSnapshots, fullName, phone, pin, address, subtotal, shipping, total, status, cancellationReason, createdAt, updatedAt]
    OrderInput:
      type: object
      properties:
        items: { type: array, minItems: 1, items: { $ref: "#/components/schemas/OrderItemInput" } }
        fullName: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        pin: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
      required: [items, fullName, phone, pin, address]
    CancelOrderInput:
      type: object
      properties: { cancellationReason: { type: string, minLength: 1 } }
      required: [cancellationReason]
    OrderUpdate:
      type: object
      properties:
        status: { type: string, enum: [Pending, Confirmed, Dispatched, Cancelled] }
        cancellationReason: { type: [string, "null"] }
      required: [status]
    Review:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        reviewerName: { type: string }
        reviewerEmail: { type: string }
        message: { type: string }
        imagePaths: { type: array, items: { type: string } }
        adminReply: { type: [string, "null"] }
        approved: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, userId, reviewerName, reviewerEmail, message, imagePaths, adminReply, approved, createdAt, updatedAt]
    PublicReview:
      type: object
      properties:
        id: { type: string }
        reviewerName: { type: string }
        message: { type: string }
        imagePaths: { type: array, items: { type: string } }
        adminReply: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, reviewerName, message, imagePaths, adminReply, createdAt]
    ReviewInput:
      type: object
      properties:
        message: { type: string, minLength: 1 }
        imagePaths: { type: array, items: { type: string } }
      required: [message]
    ReviewUpdate:
      type: object
      properties:
        adminReply: { type: [string, "null"] }
        approved: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProductVariant:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        price:
          type: integer
          minimum: 0
        inventory:
          type: integer
          minimum: 0
        imagePaths:
          type: array
          items:
            type: string
      required: [label, price]
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        price:
          type: integer
          minimum: 0
        imagePath:
          type: ["string", "null"]
        imagePaths:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        inventory:
          type: integer
          minimum: 0
        available:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, category, description, price, imagePath, imagePaths, variants, inventory, available, createdAt, updatedAt]
    ProductInput:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: integer
          minimum: 0
        imagePath:
          type: ["string", "null"]
        imagePaths:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        inventory:
          type: integer
          minimum: 0
        available:
          type: boolean
      required: [name, category, description, price]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        description:
          type: string
        price:
          type: integer
          minimum: 0
        imagePath:
          type: ["string", "null"]
        imagePaths:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        inventory:
          type: integer
          minimum: 0
        available:
          type: boolean
    OrderItemInput:
      type: object
      properties:
        productId:
          type: string
          minLength: 1
        variant:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1
      required: [productId, quantity]
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        name:
          type: string
        variant:
          type: ["string", "null"]
        quantity:
          type: integer
          minimum: 1
        price:
          type: integer
          minimum: 0
      required: [productId, name, variant, quantity, price]
    UploadUrlRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
      required: [name, size, contentType]
    ReviewImageUploadUrlRequest:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif] }
      required: [name, size, contentType]
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required: [uploadURL, objectPath]
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
      required: [error]
